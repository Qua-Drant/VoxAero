<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoxAero — 低空三维数字孪生与智能体调度平台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.tailwindcss.com/3.4.17" defer></script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js" defer></script>
  <script src="/js/app.js" type="module"></script>
</head>
<body>
  <header class="brand-bar">
    <span class="brand-symbol" aria-hidden="true"></span>
    <div class="brand">
      <strong>VoxAero</strong>
      <span>维空智航 · 低空三维导航与智能体调度平台</span>
    </div>
    <p class="brand-note">Spatial Agent &amp; 3D Airspace Twin</p>
  </header>
  <main class="workspace">
    <section class="scene" aria-label="武汉大学信息学部三维空域地图">
      <div id="map"></div>
      <div class="scene-heading">
        <h1>武汉大学 · 信息学部</h1>
        <p id="scene-status" role="status">正在加载校园空域…</p>
      </div>
      <div class="map-toolbar" role="group" aria-label="地图图层控制">
        <label><input type="checkbox" data-layer="buildings" checked disabled><span>建筑</span></label>
        <label><input type="checkbox" data-layer="vertiports" checked disabled><span>起降坪</span></label>
        <label><input type="checkbox" data-layer="nofly_zones" checked disabled><span>禁飞区</span></label>
        <label><input type="checkbox" data-layer="airspace" checked disabled><span>30 / 60 m 空域网格</span></label>
        <button id="reset-view" type="button" disabled>重置视角</button>
      </div>
    </section>
    <aside class="dispatch" aria-labelledby="dispatch-heading">
      <div class="panel-heading">
        <h2 id="dispatch-heading">任务调度</h2>
        <span id="mode" class="status-pill">连接中</span>
      </div>
      <form id="dispatch-form">
        <label for="query">调度指令</label>
        <textarea id="query" rows="3" maxlength="500" required placeholder="例如：从 VP01 配送至 VP03"></textarea>
        <div class="form-actions">
          <button id="sample" type="button" class="secondary">试跑配送示例</button>
          <button id="submit" type="submit" class="primary">规划航线</button>
        </div>
      </form>
      <p id="dispatch-status" class="feedback" role="status">输入指令或试跑配送示例。</p>
      <section class="metrics" aria-label="航线指标">
        <div class="panel-heading">
          <h3>航线指标</h3>
          <span id="compliance" class="compliance"></span>
        </div>
        <dl class="metric-grid tabular-nums">
          <div><dt>航线距离</dt><dd id="distance">—</dd></div>
          <div><dt>预计飞行</dt><dd id="duration">—</dd></div>
          <div><dt title="按模拟航速和步行速度估算">较地面节省</dt><dd id="saving">—</dd></div>
          <div><dt title="距建筑缓冲体和禁飞区的最小距离下界">净空下界</dt><dd id="clearance">—</dd></div>
        </dl>
      </section>
      <section aria-labelledby="trace-heading">
        <h3 id="trace-heading">调度过程</h3>
        <ol id="trace" class="trace" aria-live="polite">
          <li class="empty-trace">规划后显示任务解析、空域校验和工具执行结果。</li>
        </ol>
      </section>
    </aside>
  </main>
</body>
</html>
